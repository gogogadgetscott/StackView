run:
  go: "1.24"
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - asasalint
    - asciicheck
    - bodyclose
    - contextcheck
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exportloopref
    - gocritic
    - godot
    - gofmt
    - goheader
    - goprintffuncname
    - gosec
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - tagliatelle
    - tenv
    - testableexamples
    - testpackage
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - opinionated
      - experimental
  revive:
    severity: error
  govet:
    enable-all: true
  tagliatelle:
    case: snake

issues:
  exclude-rules:
    - path: "_test\\.go$"
      linters:
        - testpackage
        - nonamedreturns
