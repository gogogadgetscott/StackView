version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - STACKVIEW_SQLITE_PATH=/data/stackview.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - stackview_data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_STACKVIEW_WS=ws://backend:8080/ws/stats
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  stackview_data:
